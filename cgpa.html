        <div class="head-con" style="width: 100%; background-color: red; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding-top: 10px; padding-bottom: 20px;">
            <p style="font-size: 25px; font-weight: bold; letter-spacing: 0.7px; color: white;">CGPA CALCULATOR</p>
            <p style="color: white; font-size: 14px; margin-top: 0; letter-spacing: 0.5px;">Calculate your GPA for the semester</p>
        </div>
        <div class="body-con" style="display: flex; background-color: blueviolet; width: 100%; flex-direction: column; justify-content: center; align-items: center; gap: 5px;">
            <div class="info-box" style="background-color: brown; width: 96%;">
                <table style="width: 100%;">
                    <tr>
                        <th>Course Code</th>
                        <th>Credit Unit</th>
                        <th>Grade Point</th>
                    </tr>
                    <tr>
                        <td><input type="text" ></td>

                    </tr>
                    <tr> 
                        <td><input type="text"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                    </tr>
                    <tr>
                        <td><input type="text"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                    </tr>
                    <tr>
                        <td><input type="text"></td>
                        <td><input type="number"></td>
                        <td><input type="number"></td>
                    </tr>
                </table>

            </div>
            <button style="background-color: blue; width: 230px; height: 35px; color: white; font-size: 15px; font-weight: bold; letter-spacing: 0.7px; border-radius: 7px;">Calculate GPA</button>
            <div class="result-box" style="background-color: greenyellow; width:90%; box-sizing: border-box; border-radius: 8px;">
                <h3 style="text-align: center; margin: 0 0 6px 0; font-size: 18px;">Your Result</h3>
                <p style="margin: 2px 0; font-size: 15px;">Total credit units: 0</p>
                <p  style="margin: 2px 0; font-size: 15px;">Total quality points:0</p>
                <p style="color: green; font-size: 22px; font-weight: bold; margin: 6px 0 0 0; padding: 5px; border-radius: 5px;">GPA: 0</p>
            </div>

        </div>
    </div>
</div>
